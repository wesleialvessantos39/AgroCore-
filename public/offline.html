<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sem conexão com a internet | AgroCore</title>
    <meta name="theme-color" content="#0B3D2E" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #F8FAF9;
        color: #0F172A;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: calc(var(--sat)) calc(var(--sar)) calc(var(--sab)) calc(var(--sal));
      }
      header {
        background-color: #0B3D2E;
        color: #FFFFFF;
        border-bottom: 1px solid #07261D;
        padding: 1rem 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .logo-icon {
        width: 32px;
        height: 32px;
      }
      .brand-title {
        font-size: 1.125rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #FFFFFF;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.5rem;
        text-align: center;
        max-width: 540px;
        margin: 0 auto;
      }
      .icon-box {
        width: 64px;
        height: 64px;
        border-radius: 1rem;
        background-color: #EFF5F2;
        border: 1px solid #D1DED7;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.5rem;
        color: #0B3D2E;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: #0B3D2E;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 0.95rem;
        color: #334155;
        line-height: 1.6;
        margin-bottom: 2rem;
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        width: 100%;
        max-width: 280px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.15s ease;
        border: none;
      }
      .btn-primary {
        background-color: #0B3D2E;
        color: #FFFFFF;
      }
      .btn-primary:hover {
        background-color: #082F23;
      }
      .btn-secondary {
        background-color: #FFFFFF;
        color: #0B3D2E;
        border: 1px solid #E2E8F0;
      }
      .btn-secondary:hover {
        background-color: #EFF5F2;
      }
      footer {
        background-color: #07261D;
        color: #94A3B8;
        padding: 1rem;
        text-align: center;
        font-size: 0.75rem;
        border-top: 1px solid #0B3D2E;
      }
    </style>
  </head>
  <body>
    <header>
      <svg class="logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#07261D"/>
        <path d="M21 9.5C19.5 8 17.4 7 15 7C10.03 7 6 11.03 6 16C6 20.97 10.03 25 15 25C17.4 25 19.5 24 21 22.5" stroke="#78C89A" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="15" cy="16" r="3.2" fill="#FFFFFF"/>
        <path d="M15 13C15 13 18.5 10 24 10C24 15.5 21 19 21 19C21 19 19.5 15.5 15 13Z" fill="#78C89A"/>
      </svg>
      <span class="brand-title">AgroCore</span>
    </header>

    <main id="main-content" tabindex="-1">
      <div class="icon-box" aria-hidden="true">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="1" y1="1" x2="23" y2="23"></line>
          <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
      </div>

      <h1>Você está sem conexão</h1>
      <p>
        Esta página requer acesso à internet para carregar. Assim que sua conexão for restabelecida, tente recarregar a página.
      </p>

      <div class="actions">
        <button type="button" class="btn btn-primary" onclick="window.location.reload()">
          Tentar novamente
        </button>
        <button type="button" class="btn btn-secondary" onclick="window.history.back()">
          Voltar
        </button>
      </div>
    </main>

    <footer>
      &copy; AgroCore — Plataforma de Gestão e Crédito Rural
    </footer>
  </body>
</html>
